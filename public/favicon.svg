<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield / Hexagon -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#0c1222" stroke="url(#grad1)" stroke-width="3" />
  
  <!-- Neural Nodes -->
  <circle cx="50" cy="28" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="32" cy="50" r="4" fill="#818cf8" filter="url(#glow)" />
  <circle cx="68" cy="50" r="4" fill="#818cf8" filter="url(#glow)" />
  <circle cx="50" cy="72" r="4" fill="#c084fc" filter="url(#glow)" />
  
  <!-- Neural Interconnections -->
  <line x1="50" y1="28" x2="32" y2="50" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
  <line x1="50" y1="28" x2="68" y2="50" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />
  <line x1="32" y1="50" x2="50" y2="72" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />
  <line x1="68" y1="50" x2="50" y2="72" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6" />
  <line x1="32" y1="50" x2="68" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.5" />

  <!-- S Monogram in Center -->
  <text x="50" y="55" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
